# Deploy frontend to GitHub Pages (monorepo setup)
#
# Generate a new token to deploy:
# Account: Settings > Developer settings > Personal access tokens > Fine grained tokens
# Name: monorepo-deploy
# Expiration: Don't do dumb things
# Repository access: only select repositories
# Repository permissions:
#   Read access to metadata
#   Read and Write access to pages
#
# Add the ACCESS_TOKEN to the github repo:
# Repository: Settings > Secrets and variables > action > New repository secret
#
# Change the base url in svelte.config.js
#
# In the repository enable pages
# Settings > Pages
# Deploy from a branch: gh-pages, directory: / (root)

name: (front) Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache node and npm
        uses: actions/setup-node@v6.4.0
        with:
          node-version: latest
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Cache node modules
        id: cache-nodemodules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          # caching node_modules
          path: front/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('front/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # packages/sdk and packages/svelte-super-date-picker are consumed by front/ as
      # file: symlinks. Vite resolves their TypeScript/Svelte source directly, which
      # means each package's own dependencies (ajv, json-schema-to-ts, luxon,
      # @sveltejs/vite-plugin-svelte, ...) must be installed separately - front/'s npm
      # install does not descend into linked packages. A proper npm workspaces setup
      # at the repo root would handle this automatically in the future.
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm ci

      - name: Install svelte-super-date-picker dependencies
        working-directory: packages/svelte-super-date-picker
        run: npm ci

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        working-directory: front
        run: npm ci

      - name: Install and Build
        working-directory: front
        run: |
          npm install
          npm run build
        env:
          ENV: prod
          PUBLIC_GITHUB_COMMIT_SHA: ${{ github.event.head_commit.id }}
          PUBLIC_GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUBLIC_GITHUB_COMMIT_URL: ${{ github.event.head_commit.url }}
          PUBLIC_GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: gh-pages
          FOLDER: front/docs
