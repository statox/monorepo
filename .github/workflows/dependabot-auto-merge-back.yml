# This workflow is used to run the tests when dependabot creates a PR and automatically
# merge the PR.
#
# See https://www.statox.fr/posts/2024/04/github_dependabot_auto_merge/ for companion article
#
# The tests are used as State Checks for the PR
# And the steps trigger the approval of the PR and the setup of the auto-merge setting
#
# TODO:
# - Maybe restrict the types for the pull_request event

name: Test and AutoMerge PRs

on:
    pull_request:
        types: [opened, synchronize, edited]
        branches: [main]
        paths:
          - 'back/**'
    workflow_dispatch: # Only for tests, to remove

permissions:
    # This is needed to approve the PR
    pull-requests: write
    # This is needed to merge the PR https://github.com/cli/cli/issues/6695#issuecomment-1348430969
    contents: write

jobs:
    lint-and-format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Install node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: ./back/package-lock.json

            - name: Cache node modules
              id: cache-nodemodules
              uses: actions/cache@v6
              env:
                  cache-name: cache-node-modules
              with:
                  # caching node_modules
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install Dependencies
              working-directory: back
              if: steps.cache-nodemodules.outputs.cache-hit != 'true'
              run: npm ci

            - name: Check types
              working-directory: back
              run: npm run types

            - name: Check lint
              working-directory: back
              run: npm run lint

            - name: Check format
              working-directory: back
              run: npm run format

    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Install node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: ./back/package-lock.json

            - name: Cache node modules
              id: cache-nodemodules
              uses: actions/cache@v6
              env:
                  cache-name: cache-node-modules
              with:
                  path: node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install Dependencies
              working-directory: back
              if: steps.cache-nodemodules.outputs.cache-hit != 'true'
              run: npm ci

            - name: Start docker environment
              working-directory: back
              run: npm run env

            - name: Build app
              working-directory: back
              run: npm run build

            - name: Init mysql
              working-directory: back
              run: ./src/tools/init-db.sh

            - name: Init elk
              working-directory: back
              run: ./src/tools/init-elk.sh

            - name: Run tests
              working-directory: back
              run: npm run tests:ci

            - name: Merge test reports
              working-directory: back
              if: always()
              run: npm run ci:merge-reports

            - name: Publish test report
              uses: ctrf-io/github-test-reporter@v1.1.1
              with:
                  report-path: 'back/ctrf/ctrf-report.json'
                  summary-report: true
                  pull-request-report: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: always()

            - name: Stop containers
              working-directory: back
              if: always()
              run: npm run env:stop

    auto-merge-dependabot:
        needs: [lint-and-format, tests]
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'
        steps:
            - name: Approve the PR
              run: gh pr review --approve "$PR_URL"
              env:
                  PR_URL: ${{github.event.pull_request.html_url}}
                  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

            - name: Auto merge the PR
              run: gh pr merge --rebase --auto "$PR_URL"
              env:
                  PR_URL: ${{github.event.pull_request.html_url}}
                  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

