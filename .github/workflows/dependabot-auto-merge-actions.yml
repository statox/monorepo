# This workflow is used to lint the workflow files when dependabot bumps a
# github-actions dependency and automatically merge the PR.
#
# The lint is used as State Checks for the PR
# And the steps trigger the approval of the PR and the setup of the auto-merge setting
#
# TODO:
# - Maybe restrict the types for the pull_request event

name: (actions) AutoMerge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  # This is needed to approve the PR
  pull-requests: write
  # This is needed to merge the PR https://github.com/cli/cli/issues/6695#issuecomment-1348430969
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Lint workflow files
        uses: reviewdog/action-actionlint@v1

  auto-merge-dependabot:
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Approve the PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Auto merge the PR
        run: gh pr merge --rebase --auto "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
