# Testing LLM analysis for PR failures
# https://github.com/marketplace/actions/github-actions-failure-analysis

name: PR Failure Analysis

on:
  workflow_run:
    workflows: ["(front) AutoMerge Dependabot PRs", "(back) AutoMerge Dependabot PRs"]
    types: [completed]

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: calebevans/gha-failure-analysis@v0.2.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          llm-provider: anthropic
          llm-model: claude-3-5-sonnet-20241022
          llm-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
